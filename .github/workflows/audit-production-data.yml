name: One-Time Read-Only Production Snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create private snapshot directory
        run: mkdir -m 700 snapshot
      - name: Export Production READ ONLY
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export pc-tech-production-db --remote --env production --output=snapshot/production.sql
      - name: Verify export and stamp source manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,datetime
          p=pathlib.Path('snapshot/production.sql')
          assert p.stat().st_size>0
          text=p.read_text()
          assert 'CREATE TABLE' in text and 'INSERT INTO' in text
          manifest={'source_database':'pc-tech-production-db','source_database_id':'e863e5c3-b60f-48a5-8fdd-862f1ac52eaf','direction':'PRODUCTION_TO_LOCAL','exported_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size}
          pathlib.Path('snapshot/manifest.json').write_text(json.dumps(manifest,indent=2))
          print('Production read-only export verified:',p.stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-to-local-snapshot
          path: snapshot/
          retention-days: 1
          if-no-files-found: error

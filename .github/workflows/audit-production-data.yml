name: Audit Production Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Count production records
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute pc-tech-production-db --remote --env production --command="SELECT (SELECT COUNT(*) FROM product_specification_records) AS specifications, (SELECT COUNT(*) FROM production_plans WHERE deleted_at IS NULL) AS production_plans, (SELECT COUNT(*) FROM production_plan_lines) AS production_lines, (SELECT COUNT(*) FROM job_cards) AS job_cards;"

      - name: Verify G K UDYOG specifications
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute pc-tech-production-db --remote --env production --command="SELECT id, polar_canvas_item_code, customer_id, customer_name, item_name FROM product_specification_records WHERE customer_id = '898884000001896067' OR UPPER(customer_name) = 'G K UDYOG' ORDER BY id;"

      - name: Verify Production Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list

      - name: Verify Production Pages D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pc-tech-production" \
            | jq '{production_branch: .result.production_branch, production_d1: .result.deployment_configs.production.d1_databases, preview_d1: .result.deployment_configs.preview.d1_databases}'

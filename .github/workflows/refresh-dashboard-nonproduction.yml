name: Refresh Daily Application Caches

on:
  schedule:
    # GitHub Actions uses UTC. 01:30 UTC is 07:00 IST.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: nonproduction
            origin: https://pc-tech.pages.dev
          - environment: production
            origin: https://www.polarcanvas.in
    environment: ${{ matrix.environment }}
    env:
      CACHE_REFRESH_TOKEN: ${{ secrets.CACHE_REFRESH_TOKEN }}
      ORIGIN: ${{ matrix.origin }}
    steps:
      - name: Validate scheduled refresh credential
        run: |
          if [ "${#CACHE_REFRESH_TOKEN}" -lt 32 ]; then
            echo '::error::Configure CACHE_REFRESH_TOKEN (at least 32 characters) in this GitHub environment and its Cloudflare Pages project.'
            exit 1
          fi

      - name: Refresh dashboard snapshot and vendor cache
        run: |
          curl --fail --silent --show-error --max-time 300 \
            --request POST --header "Authorization: Bearer $CACHE_REFRESH_TOKEN" \
            "$ORIGIN/api/internal/daily-cache-refresh?cache=dashboard"

      - name: Refresh customer cache
        if: ${{ !cancelled() && env.CACHE_REFRESH_TOKEN != '' }}
        run: |
          curl --fail --silent --show-error --max-time 300 \
            --request POST --header "Authorization: Bearer $CACHE_REFRESH_TOKEN" \
            "$ORIGIN/api/internal/daily-cache-refresh?cache=customers"

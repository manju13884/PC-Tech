name: Refresh Daily Application Caches

on:
  schedule:
    # GitHub Actions uses UTC. 01:30 UTC is 07:00 IST.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh non-production dashboard snapshot
        run: curl --fail --silent --show-error --max-time 300 https://pc-tech.pages.dev/api/home-sales-orders

      - name: Refresh non-production customer cache
        run: curl --fail --silent --show-error --max-time 300 https://pc-tech.pages.dev/api/customers

      - name: Refresh production dashboard snapshot
        run: curl --fail --silent --show-error --max-time 300 https://www.polarcanvas.in/api/home-sales-orders

      - name: Refresh production customer cache
        run: curl --fail --silent --show-error --max-time 300 https://www.polarcanvas.in/api/customers

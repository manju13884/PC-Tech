name: Deploy PC-Tech Production

on:
  push:
    branches:
      - production

  workflow_dispatch:
    inputs:
      maintenance_previous_owner:
        description: 'Failed release owner to recover (leave empty for a normal deployment)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pc-tech-deployment-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYMENT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Enable production maintenance
        env:
          MAINTENANCE_PREVIOUS_OWNER: ${{ inputs.maintenance_previous_owner }}
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs on production

      - name: Prepare independent maintenance page
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs shell production

      - name: Publish maintenance gate
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .wrangler/maintenance-site --project-name=pc-tech-production --branch=production --commit-dirty=true

      - name: Verify maintenance before build and migrations
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs confirm production

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Stamp release and asset checksums
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs stamp production

      - name: Audit immutable additive D1 migrations
        run: npm run db:migrations:audit

      - name: Prepare production backup directory
        run: mkdir -p .wrangler/backups

      - name: Export production D1 backup
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export pc-tech-production-db --remote --env production --output=.wrangler/backups/pc-tech-production-db-pre-dashboard-deploy.sql

      - name: Retain encrypted production backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-tech-production-db-pre-dashboard-deploy
          path: .wrangler/backups/pc-tech-production-db-pre-dashboard-deploy.sql
          retention-days: 7
          if-no-files-found: error

      - name: List pending production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations list pc-tech-production-db --remote --env production

      - name: Apply locked Inventory migrations safely when pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: e863e5c3-b60f-48a5-8fdd-862f1ac52eaf
        run: |
          for migration in migrations/0038_create_stock_adjustments.sql migrations/0039_add_job_tracking_reel_consumption.sql migrations/0040_create_inventory_reel_reservations.sql migrations/0041_add_job_process_completion.sql migrations/0042_add_job_card_supervisor_user.sql migrations/0043_create_material_issues.sql migrations/0044_add_material_issue_invoice_mapping.sql migrations/0045_add_finished_goods_stock_permission.sql; do
            node scripts/apply-locked-d1-migration.mjs "$migration"
          done

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply pc-tech-production-db --remote --env production

      - name: Verify production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations list pc-tech-production-db --remote --env production

      - name: Remove invalid generated worker file
        run: rm -f dist/_worker.js dist/_worker.js.map

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.107.1"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pc-tech-production --branch=production --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployed release and disable maintenance
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs off production

      - name: Verify public application
        run: node --experimental-strip-types scripts/deployment-maintenance.mjs normal production

      - name: Keep maintenance enabled on failure
        if: ${{ failure() || cancelled() }}
        run: echo "Deployment failed. Maintenance mode remains enabled if activation succeeded. Use the documented recovery procedure."
